name: Auto Close External PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write
  members: read
  organization-administration: write

jobs:
  check_user:
    runs-on: "self-hosted"
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.READ_GITHUB_ORG_MEMBERS_TOKEN }}
          script: |
            const username = context.payload.pull_request.user.login;
            const allowedUsers = ['Kushmanmb', 'dependabot[bot]'];
            if (!allowedUsers.includes(username)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: 'This PR is automatically closed—external contributions are not permitted.'
              });
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                state: 'closed'
              });
            }
