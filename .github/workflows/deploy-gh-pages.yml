name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for dotnet commands'
        required: true
        type: string
      dotnet-version:
        description: '.NET SDK version to use'
        required: false
        type: string
        default: '9.0.x'
      publish-directory:
        description: 'Directory to publish (relative to working-directory)'
        required: false
        type: string
        default: 'publish'
      build-configuration:
        description: 'Build configuration (Debug or Release)'
        required: false
        type: string
        default: 'Release'
      runs-on:
        description: 'Runner label(s) to use for the job'
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Setup .NET
        uses: Kushmanmb/.github/actions/setup-dotnet@master
        with:
          working-directory: ${{ inputs.working-directory }}
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Build and publish
        shell: bash
        run: |
          dotnet publish \
            --configuration ${{ inputs.build-configuration }} \
            --output ${{ inputs.publish-directory }}
        working-directory: ${{ inputs.working-directory }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.publish-directory }}/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
