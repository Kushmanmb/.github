name: Tokens Transparency Log

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'tokens.json'

permissions:
  contents: read
  members: read
  organization-administration: write

jobs:
  fetch-and-log:
    name: Fetch tokens.json and Display Transparency Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tokens.json exists
        shell: bash
        run: |
          if [[ ! -f "tokens.json" ]]; then
            echo "::error::tokens.json not found in repository root."
            exit 1
          fi
          echo "tokens.json found."

      - name: Debug — dump raw tokens.json
        shell: bash
        run: |
          FILE="tokens.json"
          echo "::group::Raw tokens.json contents"
          echo "File: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/tokens.json"
          echo "Size: $(wc -c < "$FILE") bytes  |  Lines: $(wc -l < "$FILE")"
          echo "---"
          cat "$FILE"
          echo "::endgroup::"

      - name: Parse and display transparency log
        id: report
        shell: bash
        run: |
          FILE="tokens.json"

          echo "======================================================="
          echo "  KUSHMANMB — TOKENS TRANSPARENCY LOG"
          echo "  Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "  Source:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/tokens.json"
          echo "======================================================="
          echo ""

          # ── ENS ───────────────────────────────────────────────────
          echo "─── ENS Configuration (Mainnet) ─────────────────────"
          ENS_NAME=$(jq -r '.ens.name     // "N/A"' "$FILE")
          ENS_NET=$(jq -r  '.ens.network  // "N/A"' "$FILE")
          ENS_CID=$(jq -r  '.ens.chain_id // "N/A"' "$FILE")
          ENS_REG=$(jq -r  '.ens.registry // "N/A"' "$FILE")
          ENS_RES=$(jq -r  '.ens.resolver // "N/A"' "$FILE")
          echo "  Name:      $ENS_NAME"
          echo "  Network:   $ENS_NET"
          echo "  Chain ID:  $ENS_CID"
          echo "  Registry:  $ENS_REG"
          echo "  Resolver:  $ENS_RES"
          echo ""

          # ── Base ENS ──────────────────────────────────────────────
          echo "─── Base ENS Configuration (Base) ───────────────────"
          BASE_ENS_NAME=$(jq -r '.base_ens.name     // "N/A"' "$FILE")
          BASE_ENS_NET=$(jq -r  '.base_ens.network  // "N/A"' "$FILE")
          BASE_ENS_CID=$(jq -r  '.base_ens.chain_id // "N/A"' "$FILE")
          BASE_ENS_REG=$(jq -r  '.base_ens.registry // "N/A"' "$FILE")
          BASE_ENS_RES=$(jq -r  '.base_ens.resolver // "N/A"' "$FILE")
          echo "  Name:      $BASE_ENS_NAME"
          echo "  Network:   $BASE_ENS_NET"
          echo "  Chain ID:  $BASE_ENS_CID"
          echo "  Registry:  $BASE_ENS_REG"
          echo "  Resolver:  $BASE_ENS_RES"
          echo ""

          # ── Contract Origin Comparison ────────────────────────────
          echo "─── Contract Origin Comparison ──────────────────────"
          echo "  Field          kushmanmb.eth              kushmanmb.base.eth"
          echo "  ─────────────────────────────────────────────────────────────"
          printf "  %-14s %-26s %s\n" "Network:"  "$ENS_NET (chain $ENS_CID)"      "$BASE_ENS_NET (chain $BASE_ENS_CID)"
          printf "  %-14s %-26s %s\n" "Registry:" "$ENS_REG" "$BASE_ENS_REG"
          printf "  %-14s %-26s %s\n" "Resolver:" "$ENS_RES" "$BASE_ENS_RES"
          echo ""

          # ── Wallet ────────────────────────────────────────────────
          echo "─── Wallet Configuration ────────────────────────────"
          W_TYPE=$(jq -r '.wallet.key_type           // "N/A"' "$FILE")
          W_DOM=$(jq -r  '.wallet.domain_key         // "N/A"' "$FILE")
          W_DERIV=$(jq -r '.wallet.address_derivation // "N/A"' "$FILE")
          W_PATH=$(jq -r  '.wallet.path              // "N/A"' "$FILE")
          echo "  Key Type:            $W_TYPE"
          echo "  Domain Key:          $W_DOM"
          echo "  Address Derivation:  $W_DERIV"
          echo "  Path:                $W_PATH"
          echo ""

          # ── Tokens ───────────────────────────────────────────────
          TOKEN_COUNT=$(jq '.tokens | length' "$FILE")
          echo "─── Token List ($TOKEN_COUNT token(s) found) ─────────────────"
          jq -c '.tokens[]' "$FILE" | while IFS= read -r TOKEN; do
            SYMBOL=$(echo "$TOKEN" | jq -r '.symbol   // "N/A"')
            NAME=$(echo "$TOKEN"   | jq -r '.name     // "N/A"')
            NET=$(echo "$TOKEN"    | jq -r '.network  // "N/A"')
            CID=$(echo "$TOKEN"    | jq -r '.chain_id // "N/A"')
            DEC=$(echo "$TOKEN"    | jq -r '.decimals // "N/A"')
            TYPE=$(echo "$TOKEN"   | jq -r '.type     // "N/A"')
            echo "  [$SYMBOL] $NAME"
            echo "    Network:   $NET  (chain_id: $CID)"
            echo "    Decimals:  $DEC"
            echo "    Type:      $TYPE"
          done
          echo ""

          # ── Explorers ────────────────────────────────────────────
          EXPLORER_COUNT=$(jq '.explorers | keys | length' "$FILE")
          echo "─── Explorers ($EXPLORER_COUNT explorer(s) found) ────────────────"
          jq -r '.explorers | to_entries[] | "  \(.key): \(.value)"' "$FILE"
          echo ""

          # ── Summary ──────────────────────────────────────────────
          NATIVE_COUNT=$(jq '[.tokens[] | select(.type == "native")] | length' "$FILE")
          ERC20_COUNT=$(jq  '[.tokens[] | select(.type == "erc20")]  | length' "$FILE")
          NETWORK_LIST=$(jq -r '[.tokens[].network] | unique | join(", ")' "$FILE")
          echo "─── Summary ─────────────────────────────────────────"
          echo "  Total tokens:         $TOKEN_COUNT"
          echo "  Native tokens:        $NATIVE_COUNT"
          echo "  ERC-20 tokens:        $ERC20_COUNT"
          echo "  Networks covered:     $NETWORK_LIST"
          echo "  Total explorers:      $EXPLORER_COUNT"
          echo "======================================================="
          echo ""

          # Emit outputs for downstream steps / workflow callers
          {
            echo "token_count=$TOKEN_COUNT"
            echo "native_count=$NATIVE_COUNT"
            echo "erc20_count=$ERC20_COUNT"
            echo "explorer_count=$EXPLORER_COUNT"
            echo "networks=$NETWORK_LIST"
          } >> "$GITHUB_OUTPUT"

      - name: Write Markdown Step Summary
        shell: bash
        run: |
          FILE="tokens.json"
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/tokens.json"

          ENS_NAME=$(jq -r '.ens.name     // "N/A"' "$FILE")
          ENS_NET=$(jq -r  '.ens.network  // "N/A"' "$FILE")
          ENS_CID=$(jq -r  '.ens.chain_id // "N/A"' "$FILE")
          ENS_REG=$(jq -r  '.ens.registry // "N/A"' "$FILE")
          ENS_RES=$(jq -r  '.ens.resolver // "N/A"' "$FILE")

          BASE_ENS_NAME=$(jq -r '.base_ens.name     // "N/A"' "$FILE")
          BASE_ENS_NET=$(jq -r  '.base_ens.network  // "N/A"' "$FILE")
          BASE_ENS_CID=$(jq -r  '.base_ens.chain_id // "N/A"' "$FILE")
          BASE_ENS_REG=$(jq -r  '.base_ens.registry // "N/A"' "$FILE")
          BASE_ENS_RES=$(jq -r  '.base_ens.resolver // "N/A"' "$FILE")
          BASE_ENS_APP=$(jq -r  '.explorers.base_ens_app // "https://www.base.org/name/kushmanmb"' "$FILE")

          W_TYPE=$(jq -r  '.wallet.key_type           // "N/A"' "$FILE")
          W_DOM=$(jq -r   '.wallet.domain_key         // "N/A"' "$FILE")
          W_DERIV=$(jq -r '.wallet.address_derivation // "N/A"' "$FILE")
          W_PATH=$(jq -r  '.wallet.path               // "N/A"' "$FILE")

          TOKEN_COUNT="${{ steps.report.outputs.token_count }}"
          NATIVE_COUNT="${{ steps.report.outputs.native_count }}"
          ERC20_COUNT="${{ steps.report.outputs.erc20_count }}"
          EXPLORER_COUNT="${{ steps.report.outputs.explorer_count }}"
          NETWORK_LIST="${{ steps.report.outputs.networks }}"

          {
            echo "# 🔍 Tokens Transparency Log — Kushmanmb"
            echo ""
            echo "> **Generated:** \`${TIMESTAMP}\`  "
            echo "> **Source:** [tokens.json](${SOURCE_URL})"
            echo ""

            echo "## ENS Configuration (Mainnet)"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Name | \`${ENS_NAME}\` |"
            echo "| Network | ${ENS_NET} |"
            echo "| Chain ID | ${ENS_CID} |"
            echo "| Registry | \`${ENS_REG}\` |"
            echo "| Resolver | \`${ENS_RES}\` |"
            echo ""

            echo "## Base ENS Configuration (Base)"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Name | \`${BASE_ENS_NAME}\` |"
            echo "| Network | ${BASE_ENS_NET} |"
            echo "| Chain ID | ${BASE_ENS_CID} |"
            echo "| Registry | \`${BASE_ENS_REG}\` |"
            echo "| Resolver | \`${BASE_ENS_RES}\` |"
            echo "| App URL | [${BASE_ENS_APP}](${BASE_ENS_APP}) |"
            echo ""

            echo "## Contract Origin Comparison"
            echo "| Field | kushmanmb.eth (Mainnet) | kushmanmb.base.eth (Base) |"
            echo "|-------|------------------------|--------------------------|"
            echo "| Network | ${ENS_NET} (chain ${ENS_CID}) | ${BASE_ENS_NET} (chain ${BASE_ENS_CID}) |"
            echo "| Registry | \`${ENS_REG}\` | \`${BASE_ENS_REG}\` |"
            echo "| Resolver | \`${ENS_RES}\` | \`${BASE_ENS_RES}\` |"
            echo ""

            echo "## Wallet / Key Derivation"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Key Type | \`${W_TYPE}\` |"
            echo "| Domain Key | \`${W_DOM}\` |"
            echo "| Address Derivation | \`${W_DERIV}\` |"
            echo "| Path | \`${W_PATH}\` |"
            echo ""

            echo "## Registered Tokens (${TOKEN_COUNT})"
            echo "| Symbol | Name | Network | Chain ID | Decimals | Type |"
            echo "|--------|------|---------|----------|----------|------|"
            jq -r '.tokens[] |
              "| `\(.symbol)` | \(.name) | \(.network) | \(.chain_id) | \(.decimals) | \(.type) |"
            ' "$FILE"
            echo ""

            echo "## Explorers (${EXPLORER_COUNT})"
            echo "| Key | URL |"
            echo "|-----|-----|"
            jq -r '.explorers | to_entries[] | "| \(.key) | [\(.value)](\(.value)) |"' "$FILE"
            echo ""

            echo "## Summary"
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total tokens | **${TOKEN_COUNT}** |"
            echo "| Native tokens | ${NATIVE_COUNT} |"
            echo "| ERC-20 tokens | ${ERC20_COUNT} |"
            echo "| Networks covered | ${NETWORK_LIST} |"
            echo "| Explorers registered | ${EXPLORER_COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate workflow run with findings
        shell: bash
        run: |
          TOTAL_TOKENS="${{ steps.report.outputs.token_count }}"
          TOTAL_EXPLORERS="${{ steps.report.outputs.explorer_count }}"
          NETWORKS="${{ steps.report.outputs.networks }}"
          echo "::notice title=Transparency Report::tokens.json — $TOTAL_TOKENS token(s) across [$NETWORKS] with $TOTAL_EXPLORERS explorer(s) registered for Kushmanmb."
