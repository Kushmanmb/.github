name: 'Resolve ENS / Build Token Path'
description: 'Read tokens.json, validate the identity → address → ENS path, and emit the full consolidated token chain. Confirms the embedded wallet address is consistently bound to the kushmanmb.eth ENS name. Also resolves kushmanmb.base.eth on Base (chain 8453) and emits a side-by-side comparison of both contract origins.'

inputs:
  tokens-file:
    description: 'Path to the consolidated token registry (tokens.json)'
    required: false
    default: 'tokens.json'
  wallet-address:
    description: 'Wallet address produced by the install-wallet action (0x-prefixed). When provided it is written into the path report.'
    required: false
    default: ''
  user-identity:
    description: 'GitHub actor / user identity that was used to derive the wallet (for the path report)'
    required: false
    default: ''
  fail-on-missing-ens:
    description: 'Set to "true" to fail the step when no ENS name is found in tokens.json'
    required: false
    default: 'false'

outputs:
  ens-name:
    description: 'ENS name read from tokens.json (e.g. kushmanmb.eth)'
    value: ${{ steps.resolve.outputs.ens-name }}
  ens-app-url:
    description: 'ENS app URL for the resolved name'
    value: ${{ steps.resolve.outputs.ens-app-url }}
  etherscan-url:
    description: 'Etherscan URL for the wallet address on mainnet'
    value: ${{ steps.resolve.outputs.etherscan-url }}
  token-path:
    description: 'Human-readable string showing the full identity → address → ENS chain'
    value: ${{ steps.resolve.outputs.token-path }}
  tokens-summary:
    description: 'JSON object summarising all registered tokens and the resolved ENS binding'
    value: ${{ steps.resolve.outputs.tokens-summary }}
  verification-log:
    description: 'Human-readable docs-verification report covering every resolved input, output, and the full token chain'
    value: ${{ steps.resolve.outputs.verification-log }}
  base-ens-name:
    description: 'Base ENS name read from tokens.json (e.g. kushmanmb.base.eth)'
    value: ${{ steps.resolve.outputs.base-ens-name }}
  base-ens-app-url:
    description: 'Base ENS app URL for the resolved Basename'
    value: ${{ steps.resolve.outputs.base-ens-app-url }}
  basescan-url:
    description: 'Basescan URL for the wallet address on Base mainnet'
    value: ${{ steps.resolve.outputs.basescan-url }}
  comparison-report:
    description: 'Human-readable side-by-side comparison of kushmanmb.eth (mainnet) and kushmanmb.base.eth (Base) contract origins'
    value: ${{ steps.resolve.outputs.comparison-report }}

runs:
  using: 'composite'
  steps:
    - name: Resolve ENS and build token path
      id: resolve
      shell: bash
      env:
        TOKENS_FILE: ${{ inputs.tokens-file }}
        WALLET_ADDRESS: ${{ inputs.wallet-address }}
        USER_IDENTITY: ${{ inputs.user-identity }}
        FAIL_ON_MISSING_ENS: ${{ inputs.fail-on-missing-ens }}
      run: |
        # --- validate inputs --------------------------------------------------
        if [[ ! -f "$TOKENS_FILE" ]]; then
          echo "::error::tokens-file not found: $TOKENS_FILE"
          exit 1
        fi

        if ! command -v jq &>/dev/null; then
          echo "::error::jq is required but not found on PATH."
          exit 1
        fi

        if ! jq -e 'type == "object"' "$TOKENS_FILE" &>/dev/null; then
          echo "::error::$TOKENS_FILE must be a valid JSON object."
          exit 1
        fi

        # --- read ENS configuration ------------------------------------------
        ENS_NAME=$(jq -r '.ens.name // empty' "$TOKENS_FILE")
        ENS_NETWORK=$(jq -r '.ens.network // "mainnet"' "$TOKENS_FILE")
        ENS_CHAIN_ID=$(jq -r '.ens.chain_id // 1' "$TOKENS_FILE")
        ENS_APP_URL=$(jq -r '.explorers.ens_app // empty' "$TOKENS_FILE")
        EXPLORER_BASE=$(jq -r '.explorers.mainnet // "https://etherscan.io"' "$TOKENS_FILE")

        if [[ -z "$ENS_NAME" ]]; then
          echo "::warning::No ENS name found in $TOKENS_FILE (.ens.name)"
          if [[ "$FAIL_ON_MISSING_ENS" == "true" ]]; then
            echo "::error::ENS name is required but was not found in $TOKENS_FILE"
            exit 1
          fi
        else
          echo "ENS name   : $ENS_NAME"
          echo "Network    : $ENS_NETWORK (chain $ENS_CHAIN_ID)"
        fi

        # --- derive explorer URLs --------------------------------------------
        if [[ -z "$ENS_APP_URL" && -n "$ENS_NAME" ]]; then
          ENS_APP_URL="https://app.ens.domains/${ENS_NAME}"
        fi

        ETHERSCAN_URL=""
        if [[ -n "$WALLET_ADDRESS" ]]; then
          ETHERSCAN_URL="${EXPLORER_BASE}/address/${WALLET_ADDRESS}"
          echo "Etherscan  : $ETHERSCAN_URL"
        fi

        # --- build human-readable token path ---------------------------------
        IDENTITY_PART="${USER_IDENTITY:-<identity>}"
        ADDRESS_PART="${WALLET_ADDRESS:-<wallet-address>}"
        ENS_PART="${ENS_NAME:-<ens-name>}"

        TOKEN_PATH="${IDENTITY_PART} → hmac-sha256(identity:salt) → hmac-sha256(round1_hash) → ${ADDRESS_PART} → ${ENS_PART}"
        echo ""
        echo "Token path : $TOKEN_PATH"

        # --- summarise tokens ------------------------------------------------
        TOKEN_COUNT=$(jq '.tokens | length' "$TOKENS_FILE")
        echo "Tokens registered: $TOKEN_COUNT"

        TOKENS_SUMMARY=$(jq -n \
          --arg ens_name "$ENS_NAME" \
          --arg ens_network "$ENS_NETWORK" \
          --argjson ens_chain_id "$ENS_CHAIN_ID" \
          --arg wallet_address "$WALLET_ADDRESS" \
          --arg ens_app_url "$ENS_APP_URL" \
          --arg etherscan_url "$ETHERSCAN_URL" \
          --arg token_path "$TOKEN_PATH" \
          --argjson token_count "$TOKEN_COUNT" \
          '{
            ens_name: $ens_name,
            ens_network: $ens_network,
            ens_chain_id: $ens_chain_id,
            wallet_address: $wallet_address,
            ens_app_url: $ens_app_url,
            etherscan_url: $etherscan_url,
            token_path: $token_path,
            token_count: $token_count
          }')

        echo ""
        echo "Summary:"
        echo "$TOKENS_SUMMARY" | jq .

        # --- read Base ENS configuration -------------------------------------
        BASE_ENS_NAME=$(jq -r '.base_ens.name // empty' "$TOKENS_FILE")
        BASE_ENS_NETWORK=$(jq -r '.base_ens.network // "base"' "$TOKENS_FILE")
        BASE_ENS_CHAIN_ID=$(jq -r '.base_ens.chain_id // 8453' "$TOKENS_FILE")
        BASE_ENS_REGISTRY=$(jq -r '.base_ens.registry // "n/a"' "$TOKENS_FILE")
        BASE_ENS_RESOLVER=$(jq -r '.base_ens.resolver // "n/a"' "$TOKENS_FILE")
        BASE_ENS_APP_URL=$(jq -r '.explorers.base_ens_app // empty' "$TOKENS_FILE")
        BASESCAN_BASE=$(jq -r '.explorers.base // "https://basescan.org"' "$TOKENS_FILE")

        if [[ -z "$BASE_ENS_APP_URL" && -n "$BASE_ENS_NAME" ]]; then
          # Strip the '.base.eth' suffix to get the registered label (e.g. 'kushmanmb')
          BASE_ENS_LABEL="${BASE_ENS_NAME%.base.eth}"
          BASE_ENS_APP_URL="https://www.base.org/name/${BASE_ENS_LABEL}"
        fi

        BASESCAN_URL=""
        if [[ -n "$WALLET_ADDRESS" && -n "$BASE_ENS_NAME" ]]; then
          BASESCAN_URL="${BASESCAN_BASE}/address/${WALLET_ADDRESS}"
          echo "Basescan   : $BASESCAN_URL"
        fi

        if [[ -n "$BASE_ENS_NAME" ]]; then
          echo "Base ENS   : $BASE_ENS_NAME"
          echo "Network    : $BASE_ENS_NETWORK (chain $BASE_ENS_CHAIN_ID)"
        fi

        # --- build human-readable docs-verification log ----------------------
        TOKENS_LIST=$(jq -r 'if (.tokens | length) == 0 then "  <no tokens registered>" else .tokens[] | "  • \(.symbol) (\(.name)) — chain \(.chain_id) [\(.network)] [\(.type)]" end' "$TOKENS_FILE")
        ENS_REGISTRY=$(jq -r '.ens.registry // "n/a"' "$TOKENS_FILE")
        ENS_RESOLVER=$(jq -r '.ens.resolver // "n/a"' "$TOKENS_FILE")
        WALLET_KEY_TYPE=$(jq -r '.wallet.key_type // "n/a"' "$TOKENS_FILE")
        WALLET_DOMAIN_KEY=$(jq -r '.wallet.domain_key // "n/a"' "$TOKENS_FILE")
        WALLET_PATH_FIELD=$(jq -r '.wallet.path // "n/a"' "$TOKENS_FILE")
        ADDRESS_DERIVATION=$(jq -r '.wallet.address_derivation // "n/a"' "$TOKENS_FILE")
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        VERIFICATION_LOG="================================================================
  Resolve-ENS — Docs Verification Log                ${TIMESTAMP}
================================================================
  Inputs
  ──────────────────────────────────────────────────
  tokens-file    : ${TOKENS_FILE}
  user-identity  : ${USER_IDENTITY:-<not provided>}
  wallet-address : ${WALLET_ADDRESS:-<not provided>}

  ENS Binding (Mainnet)
  ──────────────────────────────────────────────────
  ens.name       : ${ENS_NAME:-<not resolved>}
  ens.network    : ${ENS_NETWORK:-n/a} (chain ${ENS_CHAIN_ID:-n/a})
  ens.registry   : ${ENS_REGISTRY}
  ens.resolver   : ${ENS_RESOLVER}
  ens-app-url    : ${ENS_APP_URL:-<not resolved>}
  etherscan-url  : ${ETHERSCAN_URL:-<not resolved>}

  Base ENS Binding (Base)
  ──────────────────────────────────────────────────
  base_ens.name      : ${BASE_ENS_NAME:-<not resolved>}
  base_ens.network   : ${BASE_ENS_NETWORK:-n/a} (chain ${BASE_ENS_CHAIN_ID:-n/a})
  base_ens.registry  : ${BASE_ENS_REGISTRY}
  base_ens.resolver  : ${BASE_ENS_RESOLVER}
  base-ens-app-url   : ${BASE_ENS_APP_URL:-<not resolved>}
  basescan-url       : ${BASESCAN_URL:-<not resolved>}

  Wallet / Key Derivation
  ──────────────────────────────────────────────────
  key_type       : ${WALLET_KEY_TYPE}
  domain_key     : ${WALLET_DOMAIN_KEY}
  derivation     : ${ADDRESS_DERIVATION}
  wallet.path    : ${WALLET_PATH_FIELD}

  Registered Tokens (${TOKEN_COUNT})
  ──────────────────────────────────────────────────
${TOKENS_LIST}

  Full Token Chain
  ──────────────────────────────────────────────────
  token-path     : ${TOKEN_PATH}
================================================================"

        # --- build side-by-side comparison report ----------------------------
        COMPARISON_REPORT=$(printf '%s\n' \
          "================================================================" \
          "  ENS Contract Origin Comparison                      ${TIMESTAMP}" \
          "================================================================" \
          "$(printf '  %-13s | %-42s | %s' 'Field' 'kushmanmb.eth (Mainnet)' 'kushmanmb.base.eth (Base)')" \
          "  ─────────────┼──────────────────────────────────────────┼──────────────────────────────────────────" \
          "$(printf '  %-13s | %-42s | %s' 'Name'     "${ENS_NAME:-n/a}"                                     "${BASE_ENS_NAME:-n/a}")" \
          "$(printf '  %-13s | %-42s | %s' 'Network'  "${ENS_NETWORK:-n/a} (chain ${ENS_CHAIN_ID:-n/a})"     "${BASE_ENS_NETWORK:-n/a} (chain ${BASE_ENS_CHAIN_ID:-n/a})")" \
          "$(printf '  %-13s | %-42s | %s' 'Registry' "${ENS_REGISTRY}"                                      "${BASE_ENS_REGISTRY}")" \
          "$(printf '  %-13s | %-42s | %s' 'Resolver' "${ENS_RESOLVER}"                                      "${BASE_ENS_RESOLVER}")" \
          "$(printf '  %-13s | %-42s | %s' 'App URL'  "${ENS_APP_URL:-n/a}"                                  "${BASE_ENS_APP_URL:-n/a}")" \
          "================================================================"
        )

        echo ""
        echo "$VERIFICATION_LOG"

        echo ""
        echo "Contract Origin Comparison:"
        echo "$COMPARISON_REPORT"

        # --- write verification log and comparison to step summary -----------
        {
          echo "## Resolve-ENS Verification Log"
          echo '```'
          echo "$VERIFICATION_LOG"
          echo '```'
          echo ""
          echo "## ENS Contract Origin Comparison"
          echo '```'
          echo "$COMPARISON_REPORT"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        # --- emit outputs (single-line for GITHUB_OUTPUT) --------------------
        echo "ens-name=$ENS_NAME" >> "$GITHUB_OUTPUT"
        echo "ens-app-url=$ENS_APP_URL" >> "$GITHUB_OUTPUT"
        echo "etherscan-url=$ETHERSCAN_URL" >> "$GITHUB_OUTPUT"
        echo "token-path=$TOKEN_PATH" >> "$GITHUB_OUTPUT"
        printf 'tokens-summary=%s\n' "$(echo "$TOKENS_SUMMARY" | jq -c .)" >> "$GITHUB_OUTPUT"
        echo "base-ens-name=$BASE_ENS_NAME" >> "$GITHUB_OUTPUT"
        echo "base-ens-app-url=$BASE_ENS_APP_URL" >> "$GITHUB_OUTPUT"
        echo "basescan-url=$BASESCAN_URL" >> "$GITHUB_OUTPUT"
        # verification-log uses the multiline heredoc syntax for GITHUB_OUTPUT
        {
          echo "verification-log<<__VLOG_EOF__"
          echo "$VERIFICATION_LOG"
          echo "__VLOG_EOF__"
        } >> "$GITHUB_OUTPUT"
        # comparison-report uses the multiline heredoc syntax for GITHUB_OUTPUT
        {
          echo "comparison-report<<__CMP_EOF__"
          echo "$COMPARISON_REPORT"
          echo "__CMP_EOF__"
        } >> "$GITHUB_OUTPUT"
